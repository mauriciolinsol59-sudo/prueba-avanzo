<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Simulacro AVANZO | Estudios Sociales</title><style>
:root{color-scheme:light;--paper:#EBEEF1;--paper-line:#C7CDD4;--card:#FFFFFF;--ink:#1B2430;--ink-soft:#5B6472;--accent:#2F5D50;--accent-soft:#E4ECE9;--border:#D6DBE0;--gold:#B8862E;--shadow:rgba(27,36,48,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:16px 'IBM Plex Sans',Segoe UI,Arial,sans-serif;background:repeating-linear-gradient(to bottom,var(--paper) 0,var(--paper) 34px,var(--paper-line) 34px,var(--paper-line) 35px)}
.box{max-width:760px;margin:30px auto;padding:20px}.eyebrow{font-size:12px;letter-spacing:.075em;font-weight:700;color:var(--ink-soft)}h1,h2{font-family:'Source Serif 4',Georgia,serif;letter-spacing:-.015em}h1{font-size:clamp(26px,4vw,36px);margin:10px 0 20px}h2{font-size:23px}.card{border:1px solid var(--border);background:var(--card);padding:30px;border-radius:6px;box-shadow:0 8px 28px var(--shadow)}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.pill{border:1px solid var(--border);border-radius:4px;background:var(--accent-soft);padding:9px 12px;color:var(--accent);font-weight:600;font-family:Consolas,monospace}.progress{height:7px;background:var(--paper-line);margin:24px 0;overflow:hidden}.bar{width:0;height:100%;background:var(--accent);transition:width .2s}button{cursor:pointer;font:inherit}.option{display:block;width:100%;margin:11px 0;padding:15px 17px;border:1px solid var(--border);background:#fff;text-align:left;border-radius:4px;color:var(--ink);line-height:1.45}.option:hover,.option.selected{background:var(--accent-soft);border-color:var(--accent)}.option.selected{box-shadow:inset 4px 0 var(--accent)}.actions{display:flex;justify-content:space-between;flex-wrap:wrap;gap:9px;margin-top:24px}.btn{border:0;background:var(--accent);color:white;border-radius:4px;padding:12px 19px;font-weight:700}.btn.secondary{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}.btn:disabled{opacity:.45;cursor:default}.muted{font-size:13px;color:var(--ink-soft);line-height:1.5}.hide{display:none}.score{font-size:44px;color:var(--accent);font-weight:700}p{line-height:1.6}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#14181D;--paper-line:#262E36;--card:#1B2128;--ink:#E8ECEF;--ink-soft:#9AA5AF;--accent:#6FBBA0;--accent-soft:#1E2C29;--border:#2A323A;--shadow:rgba(0,0,0,.35)}.option{background:#1B2128;color:var(--ink)}}
</style></head><body><main class="box"><div class="top"><div><div class="eyebrow">SIMULACRO AVANZO · EXAMEN DE PRÁCTICA</div><h1>Estudios Sociales</h1></div><span class="pill">50 preguntas · 90 minutos</span></div><section class="card" id="exam"><div class="top"><div class="eyebrow" id="count"></div><div class="pill" id="clock">90:00</div></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="options"></div><div class="actions"><button class="btn secondary" id="prev">Anterior</button><button class="btn" id="next">Siguiente</button><button class="btn secondary" id="finish">Entregar</button></div><p class="muted" id="answered"></p></section><section class="card hide" id="result"><h2>Resultado</h2><div class="score" id="score"></div><p id="detail"></p><p class="muted">Este es un ejercicio de distractores intencionalmente incorrectos. No representa una calificación oficial de AVANZO.</p><button class="btn" id="restart">Realizar de nuevo</button></section></main><script>
const QUESTIONS=[{"q":"¿Cuál es el primer paso del método científico aplicado a una investigación social?","options":["Aplicar la ley correspondiente","Recolectar la bibliografía final","Formular una hipótesis antes de identificar qué problema se estudiará","Publicar los resultados"],"correct":null,"origin":"fuente-sociales"},{"q":"Un establecimiento vende productos sin emitir facturas. ¿Qué consecuencia puede tener esta práctica para El Salvador?","options":["Reduce el dinero disponible para financiar servicios y obras públicas.","Aumenta automáticamente los ingresos tributarios del Estado.","Garantiza que todos los negocios paguen más impuestos.","Elimina la necesidad de presupuestos nacionales."],"correct":0,"origin":"adaptacion-item-liberado-AVANZO-2022"},{"q":"Un investigador social entrevista a 50 personas sobre sus hábitos de consumo. ¿Qué técnica de investigación está utilizando principalmente?","options":["La observación documental","El experimento de laboratorio","Aplicar un cuestionario anónimo sin hacer preguntas de seguimiento","El censo nacional"],"correct":null,"origin":"fuente-sociales"},{"q":"En El Salvador, la expansión del modelo agroexportador del café favoreció a ciertos propietarios. ¿Qué consecuencia económica y social se relaciona con este proceso?","options":["La distribución totalmente igualitaria de la tierra.","La desaparición de las diferencias entre clases sociales.","La concentración de tierras y riqueza en grupos reducidos.","La eliminación de la actividad agrícola como fuente de ingresos."],"correct":2,"origin":"adaptacion-item-liberado-AVANZO-2022"},{"q":"¿Qué caracteriza a un análisis objetivo de la realidad social?","options":["Ignorar las fuentes de información","Seleccionar únicamente los datos que confirman la opinión del investigador","Basarse únicamente en la opinión del investigador","Repetir lo que otros han dicho sin verificar"],"correct":null,"origin":"fuente-sociales"},{"q":"Si una investigación concluye que “el 70% de los jóvenes encuestados usa redes sociales más de 4 horas al día”, este dato representa:","options":["Un mito popular sin sustento","Una opinión personal del investigador","Una ley aprobada por el Estado","Una predicción causal demostrada sobre todos los jóvenes del país"],"correct":null,"origin":"fuente-sociales"},{"q":"El avance de las tecnologías digitales transformó la demanda de trabajadores. ¿Qué explica mejor la creación de nuevas carreras vinculadas a informática y software?","options":["La sociedad dejó de necesitar conocimientos técnicos.","El mercado laboral necesita habilidades para desarrollar y gestionar tecnologías.","Las empresas dejaron de utilizar información digital.","Todas las ocupaciones tradicionales fueron sustituidas por robots."],"correct":1,"origin":"adaptacion-item-liberado-AVANZO-2022"},{"q":"¿Cuál de las siguientes es una técnica de investigación social?","options":["La ecuación cuadrática","La consulta exclusiva de artículos de opinión como evidencia definitiva","La fotosíntesis","La titulación química"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué efecto político tuvo la construcción del Muro de Berlín durante la Guerra Fría?","options":["Unificó políticamente a Alemania de inmediato.","Eliminó las diferencias entre sistemas políticos europeos.","Consolidó la división de Berlín y simbolizó la separación entre bloques ideológicos.","Terminó oficialmente la Guerra Fría en 1961."],"correct":2,"origin":"adaptacion-ejemplo-oficial-AVANZO-2024"},{"q":"Al interpretar los resultados de una investigación social, es importante:","options":["Cambiar los datos si no gustan al investigador","Ignorar el contexto y solo mirar los números","Interpretar los resultados priorizando los casos más llamativos","Evitar comparar los resultados con otros estudios"],"correct":null,"origin":"fuente-sociales"},{"q":"La observación como método de investigación social consiste en:","options":["Analizar únicamente documentos históricos","Registrar únicamente los comportamientos que el investigador esperaba ver","Preguntar directamente a las personas mediante un cuestionario","Realizar experimentos controlados en laboratorio"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué proceso histórico explica el surgimiento de la rivalidad entre Estados Unidos y la Unión Soviética después de la Segunda Guerra Mundial?","options":["La formación de una alianza política permanente entre ambos.","La competencia por la influencia mundial entre modelos políticos y económicos distintos.","La creación de un solo gobierno mundial compartido.","La disolución inmediata de ambas potencias."],"correct":1,"origin":"adaptacion-ejemplo-oficial-AVANZO-2024"},{"q":"¿Por qué es importante que una muestra de investigación sea representativa?","options":["Porque garantiza que todos estén de acuerdo con el investigador","Porque elimina completamente el margen de error estadístico","Porque hace la investigación más rápida sin importar la calidad","Porque evita tener que analizar los datos"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué es una fuente primaria en una investigación histórica?","options":["Una novela histórica contemporánea","Un resumen escolar redactado décadas después","Un documento producido en la época estudiada","Una opinión sin evidencia"],"correct":2,"origin":"ampliacion"},{"q":"Un texto que presenta datos, gráficos y conclusiones basadas en un estudio sobre un problema social es un ejemplo de:","options":["Un testimonio individual que sustituye a todos los datos recopilados","Un decreto legislativo","Un poema","Un cuento"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué diferencia principal existe entre un dato y una opinión dentro de una investigación social?","options":["Los datos representan siempre una interpretación personal del investigador","No existe ninguna diferencia entre ambos","La opinión se puede medir con precisión y el dato no","El dato siempre es falso y la opinión siempre es verdadera"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué característica distingue a una democracia representativa?","options":["Las leyes son decididas solo por empresas","Se suprimen todas las elecciones","Una persona gobierna por herencia vitalicia","La ciudadanía elige representantes mediante elecciones"],"correct":3,"origin":"ampliacion"},{"q":"¿En qué año se firmaron los Acuerdos de Paz de Chapultepec que pusieron fin al conflicto armado en El Salvador?","options":["En 1991, al concluir la última ronda de negociaciones","2001","1979","1989"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué organismo internacional fue creado en 1945 para promover la paz y cooperación?","options":["Organización Mundial del Comercio","Organización de las Naciones Unidas","Mercado Común Centroamericano","Unión Europea"],"correct":1,"origin":"ampliacion"},{"q":"¿Qué caracteriza a un modelo económico de libre mercado?","options":["No existe el comercio internacional","El Estado fija todos los precios y salarios","La producción es planificada completamente por el gobierno","La fijación centralizada de todos los precios por el Estado"],"correct":null,"origin":"fuente-sociales"},{"q":"La Guerra Fría, uno de los principales conflictos ideológicos del siglo XX, enfrentó principalmente a:","options":["China y Japón por recursos naturales","Estados Unidos y China como los dos bloques enfrentados desde 1945","Inglaterra y Francia por territorios coloniales","España y Portugal por rutas comerciales"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué significa sufragio universal?","options":["Derecho exclusivo de los propietarios a votar","Elección de gobernantes exclusivamente por sorteo","Obligación de votar solo en elecciones municipales","Derecho al voto sin discriminaciones indebidas entre ciudadanos habilitados"],"correct":3,"origin":"ampliacion"},{"q":"¿Qué se entiende por “globalización”?","options":["Un modelo económico exclusivo de un solo país","La reducción del comercio internacional","Un proceso que elimina las diferencias económicas entre todos los países","La eliminación total de las fronteras políticas"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Cuál es una consecuencia común de la deforestación?","options":["Disminución garantizada de gases de efecto invernadero","Pérdida de biodiversidad y mayor erosión del suelo","Desaparición de las sequías","Aumento permanente de la fertilidad en todos los suelos"],"correct":1,"origin":"ampliacion"},{"q":"El intercambio de bienes entre países que exportan lo que producen e importan lo que no fabrican se conoce como:","options":["Proteccionismo total","Comercio interior, porque todos los intercambios se realizan dentro del país","Autarquía","Aislamiento económico"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Cuál de las siguientes es una medida económica que un gobierno puede aplicar para estimular la economía local?","options":["Prohibir toda actividad comercial","Reducir toda inversión pública sin analizar la demanda ni el empleo","Cerrar las fronteras al turismo","Eliminar la moneda nacional sin reemplazo"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué sector de la economía incluye la agricultura y la pesca?","options":["Secundario","Primario","Terciario","Cuaternario"],"correct":1,"origin":"ampliacion"},{"q":"Una cooperativa de artesanos locales que se organiza para exportar sus productos es un ejemplo de:","options":["Un monopolio estatal que prohíbe toda cooperación entre productores","Una política exclusivamente estatal","Una transformación tecnológica","Un conflicto ideológico"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué es la inflación en economía?","options":["Aumento sostenido del nivel general de precios","Incremento exclusivo de la producción","Reducción de todos los impuestos","Disminución del número de habitantes"],"correct":0,"origin":"ampliacion"},{"q":"¿Qué papel tuvo la industrialización en las transformaciones económicas, sociales y culturales del siglo XX?","options":["No tuvo ningún efecto en la sociedad","El mantenimiento de los oficios artesanales como único sector productivo","Detuvo el crecimiento económico mundial","Solo afectó a los países sin fábricas"],"correct":null,"origin":"fuente-sociales"},{"q":"El desarrollo económico de El Salvador en las últimas décadas ha estado influenciado principalmente por:","options":["La desaparición completa del comercio exterior salvadoreño","La producción industrial pesada a gran escala","La exportación exclusiva de petróleo","El aislamiento comercial total"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué se conoce como remesas familiares?","options":["Préstamos del Estado a empresas","Dinero enviado por migrantes a personas en su país de origen","Impuestos recaudados a comercios","Ganancias de exportaciones exclusivamente"],"correct":1,"origin":"ampliacion"},{"q":"¿Qué relación existe entre la globalización y las transformaciones mundiales del siglo XX y XXI?","options":["La globalización eliminó por completo el comercio entre naciones","No existe ninguna relación entre ambos conceptos","La globalización solo afecta a los países más pequeños","El aislamiento de las economías frente a la comunicación digital"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué evento histórico inició la Primera Guerra Mundial en 1914 como detonante inmediato?","options":["El asesinato del archiduque Francisco Fernando","La firma del Tratado de París de 1783","La caída del Muro de Berlín","La independencia de India"],"correct":0,"origin":"ampliacion"},{"q":"¿Cuál de los siguientes es un derecho humano reconocido universalmente?","options":["El derecho a no pagar impuestos","El derecho a evitar las leyes del país","El derecho a ocupar cualquier cargo sin requisitos","El derecho universal a ocupar cargos públicos sin requisitos legales"],"correct":null,"origin":"fuente-sociales"},{"q":"Votar en las elecciones y respetar las leyes son ejemplos de:","options":["Obligaciones solo para los funcionarios públicos","Derechos exclusivos del gobierno","Obligaciones exclusivas del gobierno que no competen a los ciudadanos","Privilegios de unos pocos ciudadanos"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Cuál fue uno de los objetivos centrales de la integración centroamericana?","options":["Sustituir todas las constituciones por una sola ley municipal","Prohibir intercambios económicos regionales","Favorecer la cooperación y el comercio entre países de la región","Eliminar todas las identidades nacionales"],"correct":2,"origin":"ampliacion"},{"q":"¿Qué acción representa una medida de protección del medio ambiente?","options":["Ignorar el manejo adecuado de desechos","Aumentar el uso de plásticos de un solo uso sin reciclar","Sustituir la reforestación por la eliminación de todas las áreas protegidas","Talar bosques sin control"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué es una encuesta?","options":["Técnica de obtención de información mediante preguntas a una muestra","Una prueba de laboratorio químico","Una lectura obligatoria de documentos antiguos","Un instrumento para medir presión atmosférica"],"correct":0,"origin":"ampliacion"},{"q":"Los recursos naturales renovables se diferencian de los no renovables en que:","options":["Que pueden regenerarse a cualquier velocidad, aun con sobreexplotación","No existe ninguna diferencia entre ambos","Los no renovables se regeneran más rápido","Ambos se agotan exactamente igual"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Cómo ha impactado el desarrollo tecnológico en la vida cotidiana de las personas?","options":["No ha generado ningún cambio significativo","Ha igualado por completo el acceso a los servicios digitales en el mundo","Ha eliminado por completo el uso de dinero","Solo ha afectado a las grandes empresas"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué derecho protege la libertad de expresión?","options":["Obligar a todas las personas a pensar igual","Publicar datos privados de cualquier persona sin consecuencias","Impedir que otros expresen desacuerdos","Manifestar ideas y opiniones dentro de los límites establecidos por los derechos de los demás"],"correct":3,"origin":"ampliacion"},{"q":"La digitalización económica se refiere principalmente a:","options":["El reemplazo de todas las monedas por una sola moneda digital obligatoria","Una ley ambiental específica","Un tipo de moneda antigua","La eliminación total del dinero físico en todos los países"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué acción ayuda a mitigar el cambio climático?","options":["Aumentar la quema de combustibles fósiles","Destruir bosques tropicales","Reducir emisiones de gases de efecto invernadero","Quemar basura al aire libre"],"correct":2,"origin":"ampliacion"},{"q":"¿Cuál es un efecto social del avance tecnológico que se debe analizar con atención?","options":["El fin de la necesidad de educación","La eliminación de todos los problemas sociales","La desaparición completa de los empleos","La desaparición definitiva de la desigualdad gracias a Internet"],"correct":null,"origin":"fuente-sociales"},{"q":"En una democracia, la división de poderes (Ejecutivo, Legislativo y Judicial) tiene como propósito principal:","options":["Dar todo el poder a un solo presidente","Reducir la participación ciudadana","Concentrar las decisiones principales en un solo poder para actuar rápido","Eliminar la necesidad de leyes"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Qué es la urbanización?","options":["Migración exclusiva hacia otros países","Crecimiento de la población y el espacio de las ciudades","Desaparición de todas las actividades rurales","Reducción obligatoria de la población total"],"correct":1,"origin":"ampliacion"},{"q":"¿Qué responsabilidad ciudadana se relaciona directamente con el cuidado de los recursos naturales?","options":["Ignorar las leyes ambientales","Explotar los recursos naturales sin restricciones para generar empleo inmediato","No participar en ninguna actividad comunitaria","Evitar pagar impuestos"],"correct":null,"origin":"fuente-sociales"},{"q":"¿Cuál es el propósito de realizar un censo de población?","options":["Sustituir los registros civiles por encuestas privadas","Obtener información general sobre habitantes y características de un territorio","Elegir a los representantes de forma directa","Medir solo los precios de alimentos"],"correct":1,"origin":"ampliacion"},{"q":"Según el caso presentado, ¿qué conclusión se puede interpretar razonablemente?","options":["Los paneles solares no tuvieron ningún efecto en el consumo eléctrico","La población abandonó el uso de energía","El municipio dejó de usar electricidad por completo","El uso de energía solar eliminó por completo el consumo eléctrico municipal"],"correct":null,"origin":"fuente-sociales"}];let answers=Array(50).fill(null),current=0,end=0,tick=null,completed=false;const $=id=>document.getElementById(id);function show(s){['exam','result'].forEach(v=>$(v).classList.toggle('hide',v!==s))}function start(){answers=Array(50).fill(null);current=0;end=Date.now()+90*60000;completed=false;show('exam');render();clearInterval(tick);tick=setInterval(clock,500);clock()}function clock(){const left=Math.max(0,Math.ceil((end-Date.now())/1000));$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0)finish()}function render(){let q=QUESTIONS[current];$('count').textContent=`Pregunta ${current+1} de 50`;$('bar').style.width=(current+1)*2+'%';$('question').textContent=q.q;$('options').replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='option'+(answers[current]===i?' selected':'');b.textContent='ABCD'[i]+'. '+opt;b.onclick=()=>{answers[current]=i;render()};$('options').append(b)});$('prev').disabled=current===0;$('next').disabled=current===49;$('answered').textContent=`${answers.filter(x=>x!==null).length} de 50 respondidas`;}function finish(){if(completed)return;completed=true;clearInterval(tick);let good=0,solved=0;QUESTIONS.forEach((q,i)=>{if(q.correct!==null){solved++;if(answers[i]===q.correct)good++}});show('result');$('score').textContent=`${good} / 20 aciertos posibles`;$('detail').textContent=`Respondiste ${answers.filter(x=>x!==null).length} de 50. ${good} respuestas acertadas de las 20 que tenían solución; las otras 30 carecen deliberadamente de respuesta correcta.`} $('restart').onclick=start;$('prev').onclick=()=>{current--;render()};$('next').onclick=()=>{current++;render()};$('finish').onclick=()=>{if(confirm('¿Deseas entregar el simulacro?'))finish()};start();</script></body></html>
